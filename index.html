<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fast Uploader</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .box { border: 2px dashed #3ecf8e; padding: 40px; text-align: center; border-radius: 8px; background: #1e1e1e; }
        input { display: none; }
        label { background: #3ecf8e; color: black; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Upload Any Photo, Video, or Doc</h2>
        <p>15GB Free Storage Limit</p><br>
        <label for="file-upload">Choose File</label>
        <input type="file" id="file-upload" onchange="uploadFile(this.files[0])">
        <p id="status"></p>
    </div>

    <script>
        // REPLACE THESE WITH YOUR SUPABASE PROJECT DETAILS (Found in Project Settings > API)
        const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
        const SUPABASE_KEY = "YOUR_ANON_PUBLIC_KEY";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function uploadFile(file) {
            if (!file) return;
            const statusText = document.getElementById('status');
            statusText.innerText = "Uploading " + file.name + "...";

            // Generates a unique file path using the timestamp
            const filePath = `${Date.now()}_${file.name}`;

            const { data, error } = await supabase.storage
                .from('uploads')
                .upload(filePath, file);

            if (error) {
                statusText.innerText = "Error: " + error.message;
                statusText.style.color = "red";
            } else {
                statusText.innerText = "Upload Successful!";
                statusText.style.color = "#3ecf8e";
            }
        }
    </script>
</body>
</html>
