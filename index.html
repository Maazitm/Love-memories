<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dream Webies Book — Modern Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Modern Dark Theme Palette */
    --bg-color: #0b0c10;
    --card-bg: rgba(22, 24, 29, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #ff2a6d;
    --primary-glow: rgba(255, 42, 109, 0.2);
    --text-main: #f0f0f5;
    --text-muted: #8b8d98;
    --success: #05d59e;
    --error: #ff4757;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 8px;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(circle at 0% 0%, var(--primary-glow) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(5, 213, 158, 0.08) 0%, transparent 40%);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- HEADER --- */
  header {
    padding: 24px 5%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--card-border);
    background: rgba(11, 12, 16, 0.5);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .brand-text {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .brand-text span {
    color: var(--primary);
    font-weight: 500;
  }

  /* --- MAIN CONTENT --- */
  main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }

  .container { 
    width: 100%; 
    max-width: 600px; 
  }

  .glass-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  
  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* --- FOLDER CONTROLS --- */
  .folder-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    margin-bottom: 24px;
  }

  .current-folder {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-main);
  }

  .current-folder svg {
    color: var(--primary);
  }

  .btn-folder {
    background: rgba(255, 42, 109, 0.1);
    color: var(--primary);
    border: 1px solid rgba(255, 42, 109, 0.2);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-folder:hover {
    background: var(--primary);
    color: #fff;
  }

  /* --- DROPZONE --- */
  .dropzone {
    border: 2px dashed var(--card-border);
    border-radius: var(--radius-md);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(255, 255, 255, 0.01);
  }
  
  .dropzone:hover, .dropzone.drag {
    border-color: var(--primary);
    background: var(--primary-glow);
    transform: translateY(-2px);
  }
  
  .dropzone-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: rgba(255, 42, 109, 0.1);
    color: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dz-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }
  .dz-sub { font-size: 0.85rem; color: var(--text-muted); }
  input[type=file] { display: none; }

  /* --- FILE LIST --- */
  .file-list {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .file-item {
    display: flex;
    gap: 16px;
    padding: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    animation: slideIn 0.3s ease forwards;
    opacity: 0;
    transform: translateY(10px);
  }
  
  @keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .file-icon {
    width: 42px; height: 42px; 
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--text-muted);
  }

  .file-details {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .file-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .file-name {
    font-size: 0.9rem; 
    font-weight: 500;
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
    padding-right: 12px;
  }
  
  .file-size { 
    font-size: 0.75rem; 
    color: var(--text-muted); 
    font-family: var(--font-mono);
  }

  .progress-track {
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    margin-bottom: 8px;
  }
  
  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: var(--primary);
    transition: width 0.2s ease, background-color 0.3s ease;
  }

  .status-text {
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--text-muted);
  }
  
  .status-text.success { color: var(--success); }
  .status-text.error { color: var(--error); }
  .status-text.uploading { color: var(--primary); }

  /* --- MODAL FOR NEW FOLDER --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  
  .modal-overlay.active {
    opacity: 1; pointer-events: auto;
  }

  .modal-card {
    background: #16181d;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    padding: 24px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  .modal-card h3 { margin-bottom: 12px; font-size: 1.1rem; }
  .modal-card input {
    width: 100%;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--card-border);
    color: white;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-family: var(--font-mono);
    outline: none;
  }
  .modal-card input:focus { border-color: var(--primary); }
  
  .modal-actions {
    display: flex; gap: 12px; justify-content: flex-end;
  }
  .btn {
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: none; cursor: pointer; font-weight: 500; font-size: 0.9rem;
  }
  .btn-cancel { background: transparent; color: var(--text-muted); }
  .btn-save { background: var(--primary); color: white; }

  @media (max-width: 480px) {
    .glass-card { padding: 24px 16px; }
    .folder-controls { flex-direction: column; align-items: flex-start; gap: 12px; }
    .btn-folder { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-text">Dream Webies <span>Book</span></div>
</header>

<main>
  <div class="container">
    <div class="glass-card">
      <h1>Secure Upload</h1>
      <p class="subtitle">Drop your files here. They will be encrypted and uploaded to your secure storage bucket.</p>

      <!-- FOLDER CONTROLS -->
      <div class="folder-controls">
        <div class="current-folder">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="folderPathDisplay">root /</span>
        </div>
        <button class="btn-folder" id="btnNewFolder">Create Folder</button>
      </div>

      <!-- DROPZONE -->
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <p class="dz-title">Click or drag files to upload</p>
        <p class="dz-sub">Uploads directly to the selected folder above</p>
        <input type="file" id="fileInput" multiple>
      </div>

      <!-- FILE LIST -->
      <div class="file-list" id="fileList"></div>
    </div>
  </div>
</main>

<!-- FOLDER CREATION MODAL -->
<div class="modal-overlay" id="folderModal">
  <div class="modal-card">
    <h3>Create New Folder</h3>
    <input type="text" id="folderInput" placeholder="e.g. documents or 2026/summer" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btnCancelFolder">Cancel</button>
      <button class="btn btn-save" id="btnSaveFolder">Set Folder</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SUPABASE CREDENTIALS
   ============================================================ */
const SUPABASE_URL = "https://iaaldlvwnspktplcsjxx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Q8CJ3T4QnEivdhYS4y2cAQ_X4QAdLin";
const BUCKET_NAME = "uploads";

let currentFolder = ""; 

// DOM Elements
const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileList  = document.getElementById('fileList');

const folderPathDisplay = document.getElementById('folderPathDisplay');
const btnNewFolder = document.getElementById('btnNewFolder');
const folderModal = document.getElementById('folderModal');
const folderInput = document.getElementById('folderInput');
const btnCancelFolder = document.getElementById('btnCancelFolder');
const btnSaveFolder = document.getElementById('btnSaveFolder');

// --- FOLDER LOGIC ---
btnNewFolder.addEventListener('click', () => {
  folderModal.classList.add('active');
  folderInput.focus();
});

function closeFolderModal() {
  folderModal.classList.remove('active');
  folderInput.value = '';
}

btnCancelFolder.addEventListener('click', closeFolderModal);

btnSaveFolder.addEventListener('click', () => {
  let val = folderInput.value.trim();
  // Sanitize input: remove leading/trailing slashes
  val = val.replace(/^\/+|\/+$/g, ''); 
  
  if (val) {
    currentFolder = val;
    folderPathDisplay.textContent = currentFolder + " /";
  } else {
    currentFolder = "";
    folderPathDisplay.textContent = "root /";
  }
  closeFolderModal();
});

// Allow Enter key to save folder
folderInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') btnSaveFolder.click();
});


// --- UPLOAD LOGIC ---
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileInput.value = ''; 
});

function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function generateId() {
  return Math.random().toString(36).substring(2, 9);
}

function handleFiles(files) {
  if (!files || files.length === 0) return;
  Array.from(files).forEach(file => {
    const fileId = generateId();
    createFileUI(file, fileId);
    uploadFile(file, fileId);
  });
}

function createFileUI(file, id) {
  const row = document.createElement('div');
  row.className = 'file-item';
  row.id = `item-${id}`;
  
  const iconSvg = `
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
      <polyline points="13 2 13 9 20 9"></polyline>
    </svg>`;

  row.innerHTML = `
    <div class="file-icon">${iconSvg}</div>
    <div class="file-details">
      <div class="file-header">
        <span class="file-name" title="${file.name}">${file.name}</span>
        <span class="file-size">${formatBytes(file.size)}</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="bar-${id}"></div>
      </div>
      <div class="status-text uploading" id="status-${id}">Preparing upload...</div>
    </div>
  `;
  
  fileList.prepend(row);
}

function updateFileStatus(id, state, message, progress = null) {
  const statusContainer = document.getElementById(`status-${id}`);
  const bar = document.getElementById(`bar-${id}`);
  
  statusContainer.className = `status-text ${state}`;
  statusContainer.textContent = message;
  
  if (progress !== null && bar) {
    bar.style.width = `${progress}%`;
    if (state === 'success') bar.style.backgroundColor = 'var(--success)';
    if (state === 'error') bar.style.backgroundColor = 'var(--error)';
  }
}

function uploadFile(file, id) {
  // Construct path including the currently selected folder
  const safeFileName = Date.now() + '_' + file.name.replace(/\s+/g, '_');
  const fullPath = currentFolder ? `${currentFolder}/${safeFileName}` : safeFileName;
  
  const url = `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${encodeURIComponent(fullPath)}`;

  const xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
  xhr.setRequestHeader('x-upsert', 'true');
  xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

  xhr.upload.onprogress = (evt) => {
    if (!evt.lengthComputable) return;
    const pct = Math.round((evt.loaded / evt.total) * 100);
    updateFileStatus(id, 'uploading', `Uploading... ${pct}%`, pct);
  };

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      updateFileStatus(id, 'success', 'Upload complete', 100);
    } else {
      let msg = 'Failed (' + xhr.status + ')';
      try {
        const body = JSON.parse(xhr.responseText);
        if (body.message) msg = body.message;
      } catch (_) {}
      updateFileStatus(id, 'error', msg, 100);
    }
  };

  xhr.onerror = () => {
    updateFileStatus(id, 'error', 'Network Error', 100);
  };

  xhr.send(file);
}
</script>
</body>
</html>
